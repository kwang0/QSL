# Continuation of the independent YC6-1 chi=512 recovery after Slurm job
# 57629467 timed out while optimizing theta/pi=0.35. The immutable accepted
# theta/pi=0.3 state is the parent. The rejected theta/pi=0.4 state remains
# numerical evidence only and is never used as a seed.
[model]
circumference = 6
shift = 1
mps_period = 6
twist_gauge = "uniform"
J1 = 1.0
J2 = 0.12
Delta1 = 1.0
Delta2 = 1.0
Bz = 0.0

[optimizer]
maxdim = 512
cutoff = 1.0e-10
residual_tol = 1.0e-5
max_iterations = 60
max_growth_steps = 20
solver_tol_scale = 100.0
solver_tol_floor = 1.0e-10
solver_krylov_dimension = 30
solver_max_iterations = 100
record_krylov_diagnostics = true
multisite_update_alg = "sequential"
restore_best_on_failure = false
require_converged = true
divergence_patience = 8
divergence_factor = 4.0
plateau_detection = true
plateau_warmup_iterations = 40
plateau_patience = 24
plateau_min_relative_improvement = 0.005

[scan]
branch = "yc6_1_legacy_period6_recovery_chi512"
preparation = "independent_theta0_legacy_period6_alternating"
direction = "forward"
lineage_policy = "strict"
fluxes_over_pi = [0.35, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0]
seed_pattern = "alternating"
random_seed = 1
adaptive_bisection = true
minimum_step_over_pi = 0.00625
save_rejected = true
require_parent_overlap = true
# This remains a broad catastrophic-jump guard, not a physical cutoff.
minimum_parent_overlap_per_site = 0.90
parent_overlap_tolerance = 1.0e-8
parent_overlap_krylov_dimension = 16
initial_state_file = "../output/science/yc6_1/legacy_period6_recovery/seed_1/chi512/states/state_0004_yc6-1_yc6_1_legacy_period6_recovery_chi512_independent_theta0_legacy_period6_alternating_forward_seed1_chi512_theta_p0p30000000_accepted_4bc2c0f34bd4.h5"
initial_state_sha256 = "741261e9fdef75b3793837f2b26f3daac4515c491baab622fc1e8d1e2c8bfe45"

[spectrum]
physical_sz_sectors = [0.0, 1.0]
neigs = 16
tolerance = 1.0e-10
krylov_dimension = 40
random_seed = 1

[runtime]
output_directory = "../output/science/yc6_1/legacy_period6_recovery_after_57629467/seed_1/chi512"
blas_threads = 1
strided_threads = 1
threaded_blocksparse = true
output_level = 1
# An immutable full-state optimizer checkpoint is written every five completed
# chi=512 outer iterations. Growth stages are also checkpointed at their ends.
# Every checkpoint is accompanied by a hash-pinned resume TOML.
optimizer_checkpoint_every_iterations = 5
