# Set scan.initial_state_file to a converged state close to theta/pi=1 before
# launching the production ladder. Direct product-state initialization is only
# useful as a diagnostic.
[model]
circumference = 6
shift = 1
twist_gauge = "uniform"
J1 = 1.0
J2 = 0.12
Delta1 = 1.0
Delta2 = 1.0
Bz = 0.0

[optimizer]
maxdim = 4096
cutoff = 1.0e-10
residual_tol = 1.0e-8
max_iterations = 150
max_growth_steps = 24
solver_tol_scale = 100.0
solver_tol_floor = 1.0e-10
multisite_update_alg = "sequential"
require_converged = true
divergence_patience = 12
divergence_factor = 4.0

[scan]
branch = "critical_chi_ladder"
fluxes_over_pi = [1.0]
seed_pattern = "alternating"
random_seed = 1
adaptive_bisection = false
minimum_step_over_pi = 0.015625
save_rejected = true

[spectrum]
physical_sz_sectors = [0.0, 1.0]
neigs = 24
tolerance = 1.0e-10
krylov_dimension = 64
random_seed = 1

[runtime]
output_directory = "../output/yc6_1_chi_ladder_at_pi"
blas_threads = 1
strided_threads = 1
threaded_blocksparse = false
output_level = 1
