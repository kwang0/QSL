# Exploratory relaxed-residual continuation of the independent YC6-1 chi=512
# recovery. The immutable theta/pi=0.3375 state was accepted under the stricter
# 1e-5 VUMPS residual profile and remains the scientific parent. The
# pre-timeout theta/pi=0.35 checkpoint is numerical evidence only and is not
# imported across the tolerance change.
[model]
circumference = 6
shift = 1
mps_period = 6
twist_gauge = "uniform"
J1 = 1.0
J2 = 0.12
Delta1 = 1.0
Delta2 = 1.0
Bz = 0.0

[optimizer]
maxdim = 512
cutoff = 1.0e-10
residual_tol = 1.0e-4
max_iterations = 60
max_growth_steps = 20
solver_tol_scale = 100.0
solver_tol_floor = 1.0e-10
solver_krylov_dimension = 30
solver_max_iterations = 100
record_krylov_diagnostics = true
multisite_update_alg = "sequential"
restore_best_on_failure = false
require_converged = true
divergence_patience = 8
divergence_factor = 4.0
plateau_detection = true
plateau_warmup_iterations = 40
plateau_patience = 24
plateau_min_relative_improvement = 0.005

[scan]
branch = "yc6_1_legacy_period6_recovery_chi512"
preparation = "independent_theta0_legacy_period6_alternating"
direction = "forward"
lineage_policy = "strict"
fluxes_over_pi = [0.35, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0]
seed_pattern = "alternating"
random_seed = 1
adaptive_bisection = true
minimum_step_over_pi = 0.00625
save_rejected = true
require_parent_overlap = true
# This remains a broad catastrophic-jump guard, not a physical cutoff.
minimum_parent_overlap_per_site = 0.90
parent_overlap_tolerance = 1.0e-8
parent_overlap_krylov_dimension = 16
initial_state_file = "../output/science/yc6_1/legacy_period6_recovery_after_57629467/seed_1/chi512/states/state_0004_yc6-1_yc6_1_legacy_period6_recovery_chi512_independent_theta0_legacy_period6_alternating_forward_seed1_chi512_theta_p0p33750000_accepted_244b767dc5c8.h5"
initial_state_sha256 = "ac239341c6b4103e4bbeae2a2468d4fd9253d5db1fbbd0d6d7b5448f9e85234b"

[spectrum]
physical_sz_sectors = [0.0, 1.0]
neigs = 16
tolerance = 1.0e-10
krylov_dimension = 40
random_seed = 1

[runtime]
output_directory = "../output/science/yc6_1/legacy_period6_recovery_tol1e4_after_p0p3375/seed_1/chi512"
blas_threads = 1
strided_threads = 1
threaded_blocksparse = true
output_level = 1
# Full restart checkpoints remain frequent, but launcher 1.3.0 routes their
# heavy HDF5 payloads to a job-specific PSCRATCH directory.
optimizer_checkpoint_every_iterations = 5
